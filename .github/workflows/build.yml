name: Gerar APK ZEZO SERVERS AUXILIO

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZEZO_SERVERS_AUXILIO_PROJETO_NOVO.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          mkdir -p project
          unzip -q ZEZO_SERVERS_AUXILIO_PROJETO_NOVO.zip -d project

      - name: Corrigir Java e Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle")
          s = p.read_text()

          s = s.replace("VERSION_1_8", "VERSION_17")
          s = s.replace("VERSION_1_8", "VERSION_17")
          s = s.replace("targetSdk 28", "targetSdk 35")
          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """,
                  1
              )

          if "kotlinOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              kotlinOptions {
                  jvmTarget = '17'
              }
          """,
                  1
              )

          p.write_text(s)
          print("Java e Kotlin configurados para 17.")
          PY

      - name: Verificar configuração
        run: cat project/app/build.gradle

      - name: Compilar APK
        run: gradle --no-daemon -p project assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEZO-SERVERS-AUXILIO-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
