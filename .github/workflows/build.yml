name: Gerar APK ZEZO SERVERS AUXILIO

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZEZO_SERVERS_AUXILIO_PROJETO_NOVO.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças e instalar SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          mkdir -p project
          unzip -q ZEZO_SERVERS_AUXILIO_PROJETO_NOVO.zip -d project

      - name: Compilar APK
        run: gradle --no-daemon -p project assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEZO-SERVERS-AUXILIO-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
